name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # Both architectures of each platform. tree-sitter grammars are C compiled
    # per target, so "it builds on x86_64 Linux" says nothing about the ARM
    # laptop or the ARM CI runner someone else uses.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # x86_64 Linux
          - ubuntu-24.04-arm   # aarch64 Linux
          - macos-latest       # aarch64 macOS
          - macos-15-intel     # x86_64 macOS
          - windows-latest     # x86_64 Windows
          - windows-11-arm     # aarch64 Windows
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test --workspace --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: documentation builds without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fail-open:
    # The contract that keeps canon out of the user's way when it breaks:
    # exit 0, nothing on stderr, stdout empty or valid JSON, whatever arrives
    # on stdin.
    #
    # Run on every platform. This previously ran on Linux only, which is the
    # one place a path never contains a backslash or a drive letter, and
    # hostile-input handling is exactly where those differ.
    name: fail-open (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --release --bin canon
      - name: the binary honours the contract under hostile input
        run: ./tests/fail-open.sh "./target/release/canon${{ runner.os == 'Windows' && '.exe' || '' }}"

  windows-wrapper:
    # The batch half of run-hook.cmd, through cmd.exe, which is the path the
    # host actually takes on Windows. The `shim` job below covers the Unix half
    # under Git Bash; nothing covered this one, and it had a real bug: it
    # looked for canon.exe while the installer writes canon-<version>.exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --release --bin canon

      - name: the wrapper runs a developer build
        shell: cmd
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          hooks\run-hook.cmd version > out.txt 2>&1
          type out.txt
          findstr /b /c:"canon " out.txt || exit /b 1

      - name: the wrapper finds a versioned binary in the data directory
        shell: cmd
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}\canon-data
        run: |
          mkdir "%CLAUDE_PLUGIN_DATA%\bin"
          copy target\release\canon.exe "%CLAUDE_PLUGIN_DATA%\bin\canon-9.9.9.exe"
          hooks\run-hook.cmd version > out.txt 2>&1
          type out.txt
          findstr /b /c:"canon " out.txt || exit /b 1

      - name: with no binary anywhere it stays silent and succeeds
        shell: cmd
        env:
          CLAUDE_PLUGIN_ROOT: ${{ runner.temp }}\empty-root
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}\empty-data
        run: |
          mkdir "%CLAUDE_PLUGIN_ROOT%" 2>nul
          hooks\run-hook.cmd inject > out.txt 2>&1
          if errorlevel 1 exit /b 1
          type out.txt
          findstr /b /c:"{}" out.txt || exit /b 1

  shim:
    # The resolution shim is shell, so nothing above tests it. It is also where
    # the platform differences live: Windows will not execute a file without an
    # executable extension, and the release assets are named accordingly. Run
    # it under bash on every platform and require it to find the local build.
    #
    # Before this existed, the shim asked the release for an asset name that
    # does not exist on Windows and then saved it under a name Windows refuses
    # to run. It failed open, so the only symptom was a plugin that silently
    # did nothing.
    name: shim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --release --bin canon
      - name: the shim resolves the local build
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          got="$(./bin/canon version)"
          echo "shim said: $got"
          case "$got" in
            canon\ *) ;;
            *) echo "the shim did not resolve a binary"; exit 1 ;;
          esac
      - name: install-local places exactly one binary the wrapper can find
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/canon-data
        run: |
          mkdir -p "$CLAUDE_PLUGIN_DATA/bin"
          touch "$CLAUDE_PLUGIN_DATA/bin/canon-0.0.9" "$CLAUDE_PLUGIN_DATA/bin/canon-0.0.8.exe"
          ./bin/install-local
          count=$(ls "$CLAUDE_PLUGIN_DATA/bin" | wc -l | tr -d ' ')
          ls "$CLAUDE_PLUGIN_DATA/bin"
          test "$count" = "1" || { echo "expected one binary, found $count"; exit 1; }

  minimum-supported-rust:
    # The declared `rust-version` has to be true, or it is worse than absent:
    # cargo will refuse a build with a confident message naming a version the
    # code does not actually need, or accept one it cannot compile.
    #
    # Pinned to the current release deliberately. canon ships prebuilt binaries
    # for eight targets, so nobody installs it by compiling, and the only cost
    # of a recent floor falls on someone building from source.
    #
    # Checked on every platform: the C grammars are built by a different
    # toolchain on each, and a given rustc pairs differently with each of them.
    name: rust 1.97.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --workspace

  plugin-manifest:
    # The manifest, the hook configuration and the crate version have to agree,
    # or the plugin installs and silently runs a different binary than it says.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
          done
      - name: plugin version matches the workspace version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          plugin=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$crate" = "$plugin" || {
            echo "Cargo.toml says $crate, plugin.json says $plugin"
            exit 1
          }
      - name: every platform the shim can ask for is published
        # The bug this guards: the release published
        # `canon-x86_64-pc-windows-msvc.exe` while the shim requested the same
        # name without the suffix. A 404, a silent fail-open, and a plugin that
        # did nothing on Windows.
        run: ./tests/asset-coverage.sh

      - name: every hook command points at a file that exists
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          config = json.load(open("hooks/hooks.json"))
          missing = []
          for event in config["hooks"].values():
              for matcher in event:
                  for hook in matcher["hooks"]:
                      script = re.sub(r'\$\{CLAUDE_PLUGIN_ROOT\}', ".", hook["command"]).strip('"')
                      target = script.split('"')[0].split()[0]
                      if not pathlib.Path(target).exists():
                          missing.append(target)
          if missing:
              print("hook commands with no file:", missing)
              sys.exit(1)
          PY
