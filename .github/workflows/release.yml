name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    # A tag that disagrees with the crate version ships a binary whose
    # `canon version` contradicts the release it was downloaded from, and the
    # install shim resolves by version, so it would never be found again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$tag" = "$crate" || {
            echo "tag v$tag does not match Cargo.toml $crate"
            exit 1
          }

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --target ${{ matrix.target }} --bin canon

      - name: name the artifact after its target
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/canon.exe" "dist/canon-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/canon" "dist/canon-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: canon-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: checksums
        working-directory: staging
        run: sha256sum canon-* > SHA256SUMS

      - name: the install shim refuses anything not listed here
        working-directory: staging
        run: |
          test -s SHA256SUMS || { echo "no checksums produced"; exit 1; }
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          generate_release_notes: true
