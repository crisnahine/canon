name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    # A tag that disagrees with the crate version ships a binary whose
    # `canon version` contradicts the release it was downloaded from, and the
    # install shim resolves by version, so it would never be found again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$tag" = "$crate" || {
            echo "tag v$tag does not match Cargo.toml $crate"
            exit 1
          }

  build:
    # Every triple `bin/canon` can compute, built natively.
    #
    # Natively, not cross-compiled: the tree-sitter grammars are C, so a cross
    # build needs a C toolchain per target and silently produces nothing
    # runnable when one is missing. A native runner also lets the smoke test
    # below actually execute what was built.
    #
    # musl matters because the shim detects it. A glibc binary does not run on
    # Alpine, and "the plugin does nothing" is the only symptom the fail-open
    # contract can produce.
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1

      - name: musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }} --bin canon

      - name: it runs on the machine that built it
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/canon"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" version

      - name: name the artifact after its target
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/canon.exe" "dist/canon-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/canon" "dist/canon-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: canon-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: checksums
        working-directory: staging
        run: sha256sum canon-* > SHA256SUMS

      - name: every triple the shim can ask for has an asset
        # The gap this closes: the shim computed a name the release never
        # published, the download 404'd, and the plugin failed open into doing
        # nothing at all.
        working-directory: staging
        run: |
          missing=0
          for triple in \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "canon-$triple" || { echo "missing canon-$triple"; missing=1; }
          done
          for triple in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            test -f "canon-$triple.exe" || { echo "missing canon-$triple.exe"; missing=1; }
          done
          test "$missing" = "0" || exit 1
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: staging/*
          generate_release_notes: true

  smoke:
    # Download the published asset the way a user's shim will, verify its
    # checksum, and run it. Building an artifact and publishing an artifact are
    # different things, and only this proves the second one.
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: canon-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: canon-aarch64-unknown-linux-gnu
          - os: macos-latest
            asset: canon-aarch64-apple-darwin
          - os: macos-15-intel
            asset: canon-x86_64-apple-darwin
          - os: windows-latest
            asset: canon-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            asset: canon-aarch64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: download, verify and run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ matrix.asset }}" --pattern SHA256SUMS --dir .
          if command -v sha256sum >/dev/null 2>&1; then
            grep " ${{ matrix.asset }}\$" SHA256SUMS | sha256sum -c -
          else
            grep " ${{ matrix.asset }}\$" SHA256SUMS | shasum -a 256 -c -
          fi
          chmod +x "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
